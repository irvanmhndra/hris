name: hris
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris_local
      POSTGRES_DB: hris
    ports: ["127.0.0.1:5440:5432"]
    volumes:
      - hris_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris"]
      interval: 3s
      timeout: 3s
      retries: 20
  # One-shot: applies pending migrations (tracked in schema_migrations), then exits.
  migrate:
    build: ./hris-api
    command: ["./migrate", "up"]
    environment:
      DATABASE_URL: postgres://hris:hris_local@db:5432/hris?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./hris-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hris:hris_local@db:5432/hris?sslmode=disable
      HTTP_ADDR: :8088
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  hris_data:
