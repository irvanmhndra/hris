name: hris
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris_local
      POSTGRES_DB: hris
    ports: ["127.0.0.1:5440:5432"]
    volumes:
      - hris_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris"]
      interval: 3s
      timeout: 3s
      retries: 20
  # One-shot: applies pending migrations (tracked in schema_migrations), then exits.
  migrate:
    build: ./hris-api
    command: ["./migrate", "up"]
    environment:
      DATABASE_URL: postgres://hris:hris_local@db:5432/hris?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./hris-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hris:hris_local@db:5432/hris?sslmode=disable
      HTTP_ADDR: :8088
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      ADMIN_URL: ${ADMIN_URL:-http://127.0.0.1:5180}
      EMPLOYEE_URL: ${EMPLOYEE_URL:-http://127.0.0.1:5181}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-People HRIS <no-reply@localhost>}
    volumes:
      - hris_uploads:/data/uploads
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  hris_data:
  hris_uploads:
