name: hris
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris_local
      POSTGRES_DB: hris
    ports: ["127.0.0.1:5440:5432"]
    volumes:
      - hris_data:/var/lib/postgresql
      - ./hris-api/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ./hris-api/migrations/000002_account_constraints.up.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ./hris-api/migrations/000003_hr_suite.up.sql:/docker-entrypoint-initdb.d/003.sql:ro
      - ./hris-api/migrations/000004_payroll.up.sql:/docker-entrypoint-initdb.d/004.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./hris-api
    environment:
      DATABASE_URL: postgres://hris:hris_local@db:5432/hris?sslmode=disable
      HTTP_ADDR: :8088
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  hris_data:
